name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: |
          mkdir out
          javac -encoding UTF-8 -d out $(find . -name '*.java')
      - name: Test
        run: java -cp out com.sla.SlaTests
